apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-node
  namespace: telemesh
  labels:
    app: gateway-node
    app.kubernetes.io/name: telemesh
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-node
  template:
    metadata:
      labels:
        app: gateway-node
    spec:
      containers:
        - name: gateway-node
          image: ghcr.io/pr-cybr/telemesh/gateway-node:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: gateway-node-config
                  key: nats_url
            - name: INFLUXDB_URL
              valueFrom:
                configMapKeyRef:
                  name: gateway-node-config
                  key: influxdb_url
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-node-secrets
                  key: influxdb_token
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-node
  namespace: telemesh
  labels:
    app: gateway-node
spec:
  selector:
    app: gateway-node
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
