[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gateway-node"
version = "0.1.0"
description = "TeleMesh Gateway Node - Reticulum router and telemetry collector"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "PR-CYBR", email = "contact@pr-cybr.org" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "paho-mqtt>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
reticulum = ["rns>=0.7.0"]
meshtastic = ["meshtastic>=2.0.0"]
nats = ["nats-py>=2.6.0"]
influxdb = ["influxdb-client>=1.40.0"]
all = [
    "rns>=0.7.0",
    "meshtastic>=2.0.0",
    "nats-py>=2.6.0",
    "influxdb-client>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
gateway-node = "gateway_node.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_node"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
