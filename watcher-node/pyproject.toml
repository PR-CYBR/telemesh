[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watcher-node"
version = "0.1.0"
description = "TeleMesh Watcher Node - Digital and RF probe detectors"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "PR-CYBR", email = "contact@pr-cybr.org" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "paho-mqtt>=2.0.0",
    "watchdog>=4.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rtlsdr = ["pyrtlsdr>=0.3.0"]
reticulum = ["rns>=0.7.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
watcher-node = "watcher_node.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_node"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
